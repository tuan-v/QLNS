name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
jobs:
    backend:
        name: Backend (Pint + PHPUnit)
        runs-on: ubuntu-latest

        steps:
            - name: Lấy mã nguồn
              uses: actions/checkout@v4

            - name: Cài PHP 8.3
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  extensions: bcmath, exif, gd, intl, pdo_sqlite, zip
                  coverage: none

            - name: Cache thư viện Composer
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: composer-${{ hashFiles('composer.lock') }}

            - name: Cài thư viện PHP
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Chuẩn bị .env
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Kiểm tra định dạng PSR-12 (Pint)
              run: vendor/bin/pint --test

            - name: Chạy test
              run: php artisan test
    frontend:
        name: Frontend (ESLint + Build)
        runs-on: ubuntu-latest

        steps:
            - name: Lấy mã nguồn
              uses: actions/checkout@v4

            - name: Cài Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
            - name: Cài thư viện JS
              run: npm ci
            - name: Chạy lint
              run: npm run lint
            - name: Chạy build
              run: npm run build
