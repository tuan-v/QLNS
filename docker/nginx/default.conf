server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;


    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # mime.types của nginx KHÔNG có đuôi .mjs nên nó trả application/octet-stream,
    # mà kèm "nosniff" ở trên thì trình duyệt từ chối chạy thẳng, không đoán lại.
    # Vite build sinh asset .mjs (pdf.worker.min-*.mjs của pdf.js) — thiếu dòng
    # này thì Web Worker không khởi động được và xem trước PDF hỏng hoàn toàn.
    # Dùng default_type trong location thay vì khối types{}: types{} đặt ở server
    # sẽ THAY THẾ cả bảng MIME kế thừa, kéo theo css/js/ảnh cũng sai kiểu.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
