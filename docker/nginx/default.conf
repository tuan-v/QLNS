server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;


    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 2026-10-14: hệ thống nội bộ — dặn công cụ tìm kiếm/bot AI không lưu trang (mạnh hơn
    # robots.txt: gắn trên từng phản hồi). Chỉ cho chính trang dùng GPS (chấm công,
    # useCheckIn.js); cấm camera/micro — script lạ có lọt vào cũng không bật được.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Nén JS/CSS/JSON (API) — file JS 500 KB còn ~150 KB khi tải về.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml font/ttf application/vnd.ms-fontobject;

    # File build của Vite có mã hash trong tên (đổi nội dung = đổi tên) -> trình duyệt
    # giữ cache 1 năm, không hỏi lại server mỗi lần mở trang. add_header trong location
    # thay thế header ở server nên phải khai lại 5 header bảo mật.
    location ^~ /build/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        access_log off;
        try_files $uri =404;

        # "^~" ở trên làm nginx BỎ QUA khối regex .mjs phía dưới cho mọi file trong
        # /build/assets/ (gồm pdf.worker-*.mjs) -> phải khai lại ngay trong khối này.
        # Không khai add_header ở đây nên vẫn kế thừa 6 header của khối cha.
        location ~* \.mjs$ {
            default_type text/javascript;
            try_files $uri =404;
        }
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # mime.types của nginx KHÔNG có đuôi .mjs nên nó trả application/octet-stream,
    # mà kèm "nosniff" ở trên thì trình duyệt từ chối chạy thẳng, không đoán lại.
    # Vite build sinh asset .mjs (pdf.worker.min-*.mjs của pdf.js) — thiếu dòng
    # này thì Web Worker không khởi động được và xem trước PDF hỏng hoàn toàn.
    # Dùng default_type trong location thay vì khối types{}: types{} đặt ở server
    # sẽ THAY THẾ cả bảng MIME kế thừa, kéo theo css/js/ảnh cũng sai kiểu.
    location ~* \.mjs$ {
        default_type text/javascript;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
