[PHP]
memory_limit = 256M
max_execution_time = 60
post_max_size = 25M
upload_max_filesize = 20M
date.timezone = Asia/Ho_Chi_Minh
expose_php = Off

; Code được mount từ ổ Windows vào container (chậm khi đọc file). revalidate_freq = 0
; bắt PHP kiểm tra lại MỌI file ở MỖI request (~0,9s/request). 2 = tối đa 2 giây kiểm
; tra 1 lần — sửa code vẫn tự áp dụng sau ~2 giây, request nhanh hơn nhiều.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
